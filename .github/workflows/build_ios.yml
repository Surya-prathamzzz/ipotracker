name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App and Create IPA
        run: |
          echo "=== Building iOS App ==="
          flutter build ios --release --no-codesign

          APP_PATH=$(find build -name "Runner.app" -type d | grep -E "Release-iphoneos|iphoneos" | head -n 1)
          echo "Found Runner.app at: $APP_PATH"
          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Runner" ]; then
            echo "Error: Runner.app or executable binary not found!"
            exit 1
          fi

          echo "=== Packaging into IPA ==="
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ipotracker.ipa Payload
          rm -rf Payload
          ls -lh ipotracker.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipotracker-ios
          path: ipotracker.ipa

      - name: Create GitHub Release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0-ios --yes || true
          gh release create v1.0.0-ios ipotracker.ipa --title "IPO Tracker iOS v1.0.0" --notes "Unsigned iOS IPA build for IPO Tracker. Install via Sideloadly, AltStore, SideStore, Scarlet, or TrollStore."
